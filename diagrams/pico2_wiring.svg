  <!-- ==================== Pad labels ==================== -->
  <text x="800" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626">VBUS &#183; 5V (red)</text>
  <text x="800" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151">GND (black)</text>
  <text x="412" y="418" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0284c7">GP12 &#183; D+ (white)</text>
  <text x="412" y="434" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d">GP13 &#183; D&#8722; (green)</text>

  <text x="440" y="532" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">Other end of cable (Lightning) &#8594; iPhone</text>
  <text x="800" y="532" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">40-pin header &#183; pin 36 = 3V3 &#8212; avoid!</text>

  <!-- ==================== Warning card ==================== -->
  <rect x="40" y="560" width="920" height="86" rx="12" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/>
  <text x="70" y="590" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">&#9888; Verify wire colors with a multimeter before soldering &#8212; colors vary by cable brand.</text>
  <text x="70" y="617" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">&#9888; VBUS is 5V. Never solder it to the 3V3 pin (pin 36) &#8212; it will destroy the board.</text>
</svg>
