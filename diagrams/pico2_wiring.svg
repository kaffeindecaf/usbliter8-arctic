<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" width="1000" height="668">
  <title>Soldered Board Wiring — Pico 2 / RP2350-Zero / Tiny2350</title>
  <rect x="0" y="0" width="1000" height="668" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>

  <text x="40" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Soldered Board Wiring</text>
  <text x="40" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">Pico 2 &#183; RP2350-Zero &#183; Tiny2350 &#8212; cut a Lightning-to-USB-A cable and solder to GPIO. All three boards use GP12 / GP13 / VBUS / GND.</text>

  <!-- ==================== Lightning cable (left) ==================== -->
  <text x="77" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4b5563">Lightning cable</text>
  <rect x="18" y="286" width="118" height="64" rx="14" fill="#4b5563"/>
  <line x1="45" y1="286" x2="45" y2="350" stroke="#374151" stroke-width="2" opacity="0.5"/>
  <line x1="95" y1="286" x2="95" y2="350" stroke="#374151" stroke-width="2" opacity="0.5"/>
  <text x="77" y="322" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#e5e7eb">USB-A end</text>

  <line x1="148" y1="268" x2="148" y2="376" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="148" y="260" text-anchor="middle" font-size="16" fill="#ef4444">&#9986;</text>

  <text x="136" y="297" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#dc2626">VBUS</text>
  <text x="136" y="317" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0284c7">D+</text>
  <text x="136" y="337" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#15803d">D&#8722;</text>
  <text x="136" y="357" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#374151">GND</text>

  <!-- ==================== Wires ==================== -->
  <path d="M 132 290 C 340 288, 540 178, 732 178" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
  <path d="M 132 310 C 300 314, 415 408, 480 413.5" fill="none" stroke="#9ca3af" stroke-width="10" stroke-linecap="round"/>
  <path d="M 132 310 C 300 314, 415 408, 480 413.5" fill="none" stroke="#f3f4f6" stroke-width="6" stroke-linecap="round"/>
  <path d="M 132 330 C 300 334, 415 432, 480 429" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
  <path d="M 132 350 C 340 352, 540 212, 732 209" fill="none" stroke="#374151" stroke-width="7" stroke-linecap="round"/>

  <!-- ==================== Pico 2 board ==================== -->
  <rect x="440" y="140" width="340" height="370" rx="14" fill="#3d8b62" stroke="#1d4d36" stroke-width="3"/>
  <text x="462" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#e8f7ef" opacity="0.9">Raspberry Pi Pico 2</text>
  <text x="462" y="498" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1" fill="#bfe8d2" opacity="0.8">usbliter8</text>

  <!-- USB-C connector -->
  <rect x="550" y="112" width="120" height="38" rx="6" fill="#9aa3ad" stroke="#6b7280" stroke-width="2"/>
  <rect x="575" y="112" width="70" height="10" rx="5" fill="#4b5563"/>
  <text x="610" y="104" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">USB &#8594; PC</text>

  <!-- BOOTSEL -->
  <rect x="700" y="165" width="30" height="16" rx="4" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="715" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8" fill="#6b7280">BOOTSEL</text>

  <!-- RP2350 chip -->
  <rect x="560" y="240" width="100" height="100" rx="8" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <text x="610" y="296" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e5e7eb">RP2350</text>
  <line x1="560" y1="310" x2="660" y2="310" stroke="#4b5563" stroke-width="2"/>
  <line x1="575" y1="310" x2="575" y2="340" stroke="#4b5563" stroke-width="2"/>
  <line x1="595" y1="310" x2="595" y2="340" stroke="#4b5563" stroke-width="2"/>
  <line x1="615" y1="310" x2="615" y2="340" stroke="#4b5563" stroke-width="2"/>
  <line x1="635" y1="310" x2="635" y2="340" stroke="#4b5563" stroke-width="2"/>
  <line x1="645" y1="310" x2="645" y2="340" stroke="#4b5563" stroke-width="2"/>
  <line x1="575" y1="340" x2="645" y2="340" stroke="#4b5563" stroke-width="2"/>
  <line x1="585" y1="340" x2="585" y2="332" stroke="#4b5563" stroke-width="2"/>
  <line x1="595" y1="340" x2="595" y2="332" stroke="#4b5563" stroke-width="2"/>
  <line x1="605" y1="340" x2="605" y2="332" stroke="#4b5563" stroke-width="2"/>
  <line x1="615" y1="340" x2="615" y2="332" stroke="#4b5563" stroke-width="2"/>
  <line x1="625" y1="340" x2="625" y2="332" stroke="#4b5563" stroke-width="2"/>
  <line x1="635" y1="340" x2="635" y2="332" stroke="#4b5563" stroke-width="2"/>

  <!-- ==================== Pin pads ==================== -->
  <!-- Left column pins 1-20 -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">
    <circle cx="484" cy="178" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="178" r="4.5" fill="#263238"/><text x="499" y="181.5">1</text>
    <circle cx="484" cy="193.7" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="193.7" r="4.5" fill="#263238"/><text x="499" y="197.2">2</text>
    <circle cx="484" cy="209.4" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="209.4" r="4.5" fill="#263238"/><text x="499" y="212.9">3</text>
    <circle cx="484" cy="225.1" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="225.1" r="4.5" fill="#263238"/><text x="499" y="228.6">4</text>
