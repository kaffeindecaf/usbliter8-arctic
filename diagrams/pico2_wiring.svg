<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" width="1000" height="668">
  <title>Soldered Board Wiring — Pico 2 / RP2350-Zero / Tiny2350</title>
  <defs>
    <linearGradient id="cableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="0.45" stop-color="#39414c"/>
      <stop offset="0.55" stop-color="#39414c"/>
      <stop offset="1" stop-color="#525b66"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42966d"/>
      <stop offset="1" stop-color="#357a58"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="668" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>

  <text x="40" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Soldered Board Wiring</text>
  <text x="40" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">Pico 2 &#183; RP2350-Zero &#183; Tiny2350 &#8212; cut a Lightning-to-USB-A cable, keep the Lightning end, solder the 4 wires to GPIO.</text>

  <!-- ==================== Cable (left) ==================== -->
  <text x="130" y="264" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4b5563">&#8592; to iPhone (Lightning end)</text>
  <circle cx="38" cy="306" r="20" fill="url(#cableGrad)" stroke="#2f3540" stroke-width="1.5"/>
  <rect x="30" y="286" width="200" height="40" fill="url(#cableGrad)"/>
  <line x1="30" y1="306" x2="230" y2="306" stroke="#2f3540" stroke-width="1.5" opacity="0.45"/>

  <!-- cut line + scissors -->
  <line x1="245" y1="248" x2="245" y2="352" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="245" y="242" text-anchor="middle" font-size="16" fill="#ef4444">&#9986;</text>
  <text x="245" y="372" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ef4444">cut here</text>
  <text x="245" y="382" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#9ca3af">discard USB-A plug</text>

  <!-- exposed wires -->
  <line x1="248" y1="268" x2="330" y2="268" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <line x1="248" y1="292" x2="330" y2="292" stroke="#9ca3af" stroke-width="9" stroke-linecap="round"/>
  <line x1="248" y1="292" x2="330" y2="292" stroke="#f3f4f6" stroke-width="5" stroke-linecap="round"/>
  <line x1="248" y1="316" x2="330" y2="316" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <line x1="248" y1="340" x2="330" y2="340" stroke="#374151" stroke-width="5" stroke-linecap="round"/>

  <!-- wire labels with white halo -->
  <text x="340" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#dc2626" paint-order="stroke" stroke="#ffffff" stroke-width="4">VBUS &#183; 5V</text>
  <text x="340" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0284c7" paint-order="stroke" stroke="#ffffff" stroke-width="4">D+</text>
  <text x="340" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#15803d" paint-order="stroke" stroke="#ffffff" stroke-width="4">D&#8722;</text>
  <text x="340" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#374151" paint-order="stroke" stroke="#ffffff" stroke-width="4">GND</text>

  <!-- ==================== Wires to board ==================== -->
  <path d="M 330 268 C 480 268, 560 178, 734 178" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <path d="M 330 292 C 440 292, 420 400, 482 413" fill="none" stroke="#9ca3af" stroke-width="9" stroke-linecap="round"/>
  <path d="M 330 292 C 440 292, 420 400, 482 413" fill="none" stroke="#f3f4f6" stroke-width="5" stroke-linecap="round"/>
  <path d="M 330 316 C 440 316, 420 432, 482 429" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <path d="M 330 340 C 480 340, 560 209, 734 209" fill="none" stroke="#374151" stroke-width="5" stroke-linecap="round"/>

  <!-- ==================== Pico 2 board ==================== -->
  <rect x="444" y="144" width="340" height="370" rx="14" fill="#000000" opacity="0.12"/>
  <rect x="440" y="140" width="340" height="370" rx="14" fill="url(#boardGrad)" stroke="#1d4d36" stroke-width="3"/>
  <text x="462" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#e8f7ef" opacity="0.9">Raspberry Pi Pico 2</text>
  <text x="462" y="498" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1" fill="#bfe8d2" opacity="0.8">usbliter8</text>

  <!-- USB-C connector -->
  <rect x="550" y="112" width="120" height="38" rx="6" fill="#9aa3ad" stroke="#6b7280" stroke-width="2"/>
  <rect x="575" y="112" width="70" height="10" rx="5" fill="#4b5563"/>
  <text x="610" y="104" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">USB &#8594; PC</text>

  <!-- BOOTSEL -->
  <rect x="700" y="165" width="30" height="16" rx="4" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="715" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8" fill="#6b7280">BOOTSEL</text>

  <!-- RP2350 chip -->
  <rect x="560" y="240" width="100" height="100" rx="8" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <text x="610" y="296" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e5e7eb">RP2350</text>
  <line x1="560" y1="310" x2="660" y2="310" stroke="#4b5563" stroke-width="2"/>
  <line x1="575" y1="310" x2="575" y2="340" stroke="#4b5563" stroke-width="2"/>
  <line x1="595" y1="310" x2="595" y2="340" stroke="#4b5563" stroke-width="2"/>
  <line x1="615" y1="310" x2="615" y2="340" stroke="#4b5563" stroke-width="2"/>
  <line x1="635" y1="310" x2="635" y2="340" stroke="#4b5563" stroke-width="2"/>
  <line x1="645" y1="310" x2="645" y2="340" stroke="#4b5563" stroke-width="2"/>
  <line x1="575" y1="340" x2="645" y2="340" stroke="#4b5563" stroke-width="2"/>

  <!-- ==================== Pin pads ==================== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">
    <circle cx="484" cy="178" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="178" r="4.5" fill="#263238"/><text x="499" y="181.5">1</text>
    <circle cx="484" cy="193.7" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="193.7" r="4.5" fill="#263238"/><text x="499" y="197.2">2</text>
    <circle cx="484" cy="209.4" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="209.4" r="4.5" fill="#263238"/><text x="499" y="212.9">3</text>
    <circle cx="484" cy="225.1" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="225.1" r="4.5" fill="#263238"/><text x="499" y="228.6">4</text>
    <circle cx="484" cy="240.8" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="240.8" r="4.5" fill="#263238"/><text x="499" y="244.3">5</text>
    <circle cx="484" cy="256.5" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="256.5" r="4.5" fill="#263238"/><text x="499" y="260">6</text>
    <circle cx="484" cy="272.2" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="272.2" r="4.5" fill="#263238"/><text x="499" y="275.7">7</text>
    <circle cx="484" cy="287.9" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="287.9" r="4.5" fill="#263238"/><text x="499" y="291.4">8</text>
    <circle cx="484" cy="303.6" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="303.6" r="4.5" fill="#263238"/><text x="499" y="307.1">9</text>
    <circle cx="484" cy="319.3" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="319.3" r="4.5" fill="#263238"/><text x="499" y="322.8">10</text>
    <circle cx="484" cy="335" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="335" r="4.5" fill="#263238"/><text x="499" y="338.5">11</text>
    <circle cx="484" cy="350.7" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="350.7" r="4.5" fill="#263238"/><text x="499" y="354.2">12</text>
    <circle cx="484" cy="366.4" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="366.4" r="4.5" fill="#263238"/><text x="499" y="369.9">13</text>
    <circle cx="484" cy="382.1" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="382.1" r="4.5" fill="#263238"/><text x="499" y="385.6">14</text>
    <circle cx="484" cy="397.8" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="397.8" r="4.5" fill="#263238"/><text x="499" y="401.3">15</text>
  </g>

  <!-- Highlighted: pin 16 GP12 -->
  <circle cx="484" cy="413.5" r="13" fill="none" stroke="#0ea5e9" stroke-width="2.5"/>
  <circle cx="484" cy="413.5" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="413.5" r="4.5" fill="#263238"/>
  <text x="499" y="417" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">16</text>
  <!-- Highlighted: pin 17 GP13 -->
  <circle cx="484" cy="429.2" r="13" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="484" cy="429.2" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="429.2" r="4.5" fill="#263238"/>
  <text x="499" y="432.7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">17</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">
    <circle cx="484" cy="444.9" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="444.9" r="4.5" fill="#263238"/><text x="499" y="448.4">18</text>
    <circle cx="484" cy="460.6" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="460.6" r="4.5" fill="#263238"/><text x="499" y="464.1">19</text>
    <circle cx="484" cy="476.3" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="476.3" r="4.5" fill="#263238"/><text x="499" y="479.8">20</text>
  </g>

  <!-- Highlighted: pin 40 VBUS -->
  <circle cx="736" cy="178" r="13" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="736" cy="178" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="178" r="4.5" fill="#263238"/>
  <text x="723" y="181.5" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">40</text>
  <circle cx="736" cy="193.7" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="193.7" r="4.5" fill="#263238"/>
  <text x="723" y="197.2" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">39</text>
  <!-- Highlighted: pin 38 GND -->
  <circle cx="736" cy="209.4" r="13" fill="none" stroke="#374151" stroke-width="2.5"/>
  <circle cx="736" cy="209.4" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="209.4" r="4.5" fill="#263238"/>
  <text x="723" y="212.9" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">38</text>
  <circle cx="736" cy="225.1" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="225.1" r="4.5" fill="#263238"/>
  <text x="723" y="228.6" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#b45309" font-weight="700">37</text>
  <circle cx="736" cy="240.8" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="240.8" r="4.5" fill="#263238"/>
  <text x="723" y="244.3" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#b45309" font-weight="700">36</text>
  <circle cx="736" cy="256.5" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="256.5" r="4.5" fill="#263238"/>
  <text x="723" y="260" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">35</text>
  <circle cx="736" cy="272.2" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="272.2" r="4.5" fill="#263238"/>
  <text x="723" y="275.7" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">34</text>
  <circle cx="736" cy="287.9" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="287.9" r="4.5" fill="#263238"/>
  <text x="723" y="291.4" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">33</text>
  <circle cx="736" cy="303.6" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="303.6" r="4.5" fill="#263238"/>
  <text x="723" y="307.1" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">32</text>
  <circle cx="736" cy="319.3" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="319.3" r="4.5" fill="#263238"/>
  <text x="723" y="322.8" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">31</text>
  <circle cx="736" cy="335" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="335" r="4.5" fill="#263238"/>
  <text x="723" y="338.5" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">30</text>
  <circle cx="736" cy="350.7" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="350.7" r="4.5" fill="#263238"/>
  <text x="723" y="354.2" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">29</text>
  <circle cx="736" cy="366.4" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="366.4" r="4.5" fill="#263238"/>
  <text x="723" y="369.9" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">28</text>
  <circle cx="736" cy="382.1" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="382.1" r="4.5" fill="#263238"/>
  <text x="723" y="385.6" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">27</text>
  <circle cx="736" cy="397.8" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="397.8" r="4.5" fill="#263238"/>
  <text x="723" y="401.3" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">26</text>
  <circle cx="736" cy="413.5" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="413.5" r="4.5" fill="#263238"/>
  <text x="723" y="417" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">25</text>
  <circle cx="736" cy="429.2" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="429.2" r="4.5" fill="#263238"/>
  <text x="723" y="432.7" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">24</text>
  <circle cx="736" cy="444.9" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="444.9" r="4.5" fill="#263238"/>
  <text x="723" y="448.4" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">23</text>
  <circle cx="736" cy="460.6" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="460.6" r="4.5" fill="#263238"/>
  <text x="723" y="464.1" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">22</text>
  <circle cx="736" cy="476.3" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="476.3" r="4.5" fill="#263238"/>
  <text x="723" y="479.8" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">21</text>

  <!-- ==================== Pad labels ==================== -->
  <text x="800" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626">VBUS &#183; 5V (red)</text>
  <text x="800" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151">GND (black)</text>
  <text x="800" y="247" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#b45309">36 = 3V3 &#8212; do not use</text>
  <text x="412" y="418" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0284c7">GP12 &#183; D+ (white)</text>
  <text x="412" y="434" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d">GP13 &#183; D&#8722; (green)</text>

  <!-- ==================== Warning card ==================== -->
  <rect x="40" y="560" width="920" height="86" rx="12" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/>
  <text x="70" y="590" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">&#9888; Verify wire colors with a multimeter before soldering &#8212; colors vary by cable brand.</text>
  <text x="70" y="617" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">&#9888; VBUS is 5V. Never solder it to the 3V3 pin (pin 36) &#8212; it will destroy the board.</text>
</svg>
