  <text x="723" y="448.4" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">23</text>
  <circle cx="736" cy="460.6" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="460.6" r="4.5" fill="#263238"/>
  <text x="723" y="464.1" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">22</text>
