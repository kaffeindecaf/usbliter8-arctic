    <circle cx="484" cy="287.9" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="287.9" r="4.5" fill="#263238"/><text x="499" y="291.4">8</text>
    <circle cx="484" cy="303.6" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="303.6" r="4.5" fill="#263238"/><text x="499" y="307.1">9</text>
    <circle cx="484" cy="319.3" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="319.3" r="4.5" fill="#263238"/><text x="499" y="322.8">10</text>
    <circle cx="484" cy="335" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="335" r="4.5" fill="#263238"/><text x="499" y="338.5">11</text>
    <circle cx="484" cy="350.7" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="350.7" r="4.5" fill="#263238"/><text x="499" y="354.2">12</text>
    <circle cx="484" cy="366.4" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="366.4" r="4.5" fill="#263238"/><text x="499" y="369.9">13</text>
    <circle cx="484" cy="382.1" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="382.1" r="4.5" fill="#263238"/><text x="499" y="385.6">14</text>
    <circle cx="484" cy="397.8" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="397.8" r="4.5" fill="#263238"/><text x="499" y="401.3">15</text>
  </g>

  <!-- Highlighted: pin 16 GP12 -->
  <circle cx="484" cy="413.5" r="13" fill="none" stroke="#0ea5e9" stroke-width="2.5"/>
  <circle cx="484" cy="413.5" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="413.5" r="4.5" fill="#263238"/>
  <text x="499" y="417" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">16</text>
  <!-- Highlighted: pin 17 GP13 -->
  <circle cx="484" cy="429.2" r="13" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="484" cy="429.2" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="429.2" r="4.5" fill="#263238"/>
  <text x="499" y="432.7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">17</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">
    <circle cx="484" cy="444.9" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="444.9" r="4.5" fill="#263238"/><text x="499" y="448.4">18</text>
    <circle cx="484" cy="460.6" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="460.6" r="4.5" fill="#263238"/><text x="499" y="464.1">19</text>
    <circle cx="484" cy="476.3" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="484" cy="476.3" r="4.5" fill="#263238"/><text x="499" y="479.8">20</text>
  </g>

  <!-- Right column pins 40-21 -->
  <!-- Highlighted: pin 40 VBUS -->
  <circle cx="736" cy="178" r="13" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="736" cy="178" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="178" r="4.5" fill="#263238"/>
  <text x="723" y="181.5" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">40</text>
  <circle cx="736" cy="193.7" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="193.7" r="4.5" fill="#263238"/>
  <text x="723" y="197.2" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">39</text>
  <!-- Highlighted: pin 38 GND -->
  <circle cx="736" cy="209.4" r="13" fill="none" stroke="#374151" stroke-width="2.5"/>
  <circle cx="736" cy="209.4" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="209.4" r="4.5" fill="#263238"/>
  <text x="723" y="212.9" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">38</text>
  <circle cx="736" cy="225.1" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="225.1" r="4.5" fill="#263238"/>
  <text x="723" y="228.6" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#b45309" font-weight="700">37</text>
  <circle cx="736" cy="240.8" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="240.8" r="4.5" fill="#263238"/>
  <text x="723" y="244.3" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#b45309" font-weight="700">36</text>
  <circle cx="736" cy="256.5" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="256.5" r="4.5" fill="#263238"/>
  <text x="723" y="260" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">35</text>
  <circle cx="736" cy="272.2" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="272.2" r="4.5" fill="#263238"/>
  <text x="723" y="275.7" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">34</text>
  <circle cx="736" cy="287.9" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="287.9" r="4.5" fill="#263238"/>
  <text x="723" y="291.4" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">33</text>
  <circle cx="736" cy="303.6" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="303.6" r="4.5" fill="#263238"/>
  <text x="723" y="307.1" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">32</text>
  <circle cx="736" cy="319.3" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="319.3" r="4.5" fill="#263238"/>
  <text x="723" y="322.8" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#0c3b26" opacity="0.85">31</text>
  <circle cx="736" cy="335" r="9" fill="#d9a441" stroke="#a8792a" stroke-width="1.5"/><circle cx="736" cy="335" r="4.5" fill="#263238"/>
